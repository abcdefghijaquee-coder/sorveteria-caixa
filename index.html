<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caixa S&amp;F</title>
  <meta name="theme-color" content="#7c3aed" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img src="logo.png" alt="S&amp;F Açaí, Sorveteria e Lanchonete" class="brand-logo" />
      <h1 style="text-align:center;margin-top:2px">S&amp;F</h1>
      <p style="text-align:center;color:var(--muted);margin-top:-6px">Entre com seu usuário e senha</p>
      <div class="form" style="grid-template-columns:1fr;margin-top:18px">
        <div><label>Usuário</label><input id="loginUser" placeholder="Seu usuário" autocomplete="username"></div>
        <div><label>Senha</label><input id="loginPass" type="password" placeholder="Sua senha" autocomplete="current-password"></div>
        <button class="finish" id="loginBtn">Entrar</button>
        <div id="loginError" class="hidden" style="color:var(--danger);font-size:13px;text-align:center"></div>
      </div>
      <div id="loginHint" class="hidden" style="margin-top:16px;color:var(--muted);font-size:12px;text-align:center">Primeiro acesso: crie o usuário administrador abaixo.</div>
    </div>
  </div>

  <div id="appRoot" class="hidden">
  <header class="topbar">
    <div>
      <div class="eyebrow">CAIXA</div>
      <h1><img src="logo.png" alt="S&amp;F" class="topbar-logo" /> S&amp;F</h1>
    </div>
    <div class="top-actions">
      <span id="currentUserLabel" class="current-user"></span>
      <button class="ghost" id="openReports">Relatórios</button>
      <button class="ghost" id="openProducts">Produtos</button>
      <button class="ghost" id="openUsers">Usuários</button>
      <button class="ghost" id="openSettings">Balança</button>
      <button class="ghost danger" id="logoutBtn">Sair</button>
    </div>
  </header>

  <main class="layout">
    <section class="catalog panel">
      <div class="section-head">
        <div>
          <h2>Produtos</h2>
          <p>Toque para adicionar ao pedido</p>
        </div>
        <input id="search" class="search" placeholder="Buscar por nome ou nº..." />
      </div>
      <div id="categories" class="chips"></div>
      <div id="products" class="product-grid"></div>
    </section>

    <aside class="order panel">
      <div class="section-head">
        <div>
          <h2>Pedido atual</h2>
          <p id="orderNumber">Pedido #001</p>
        </div>
        <button class="danger ghost" id="clearCart">Limpar</button>
      </div>
      <div id="cart" class="cart"></div>

      <div class="weight-box">
        <div>
          <strong>Peso do sorvete</strong>
          <small id="scaleStatus">Balança não conectada</small>
        </div>
        <div class="weight-value"><span id="weight">0,000</span> kg</div>
        <div class="weight-actions">
          <button class="secondary" id="connectScale">Conectar balança</button>
          <button class="secondary" id="useWeight">Adicionar por peso</button>
        </div>
      </div>

      <div class="totals">
        <div><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div>
        <div class="total"><span>Total</span><strong id="total">R$ 0,00</strong></div>
      </div>

      <div class="payment">
        <h3>Pagamento</h3>
        <div class="payment-grid">
          <button data-payment="Dinheiro">Dinheiro</button>
          <button data-payment="Pix">Pix</button>
          <button data-payment="Débito">Débito</button>
          <button data-payment="Crédito">Crédito</button>
        </div>
        <div id="cashChange" class="cash-change hidden">
          <label>Valor recebido</label>
          <input id="cashReceived" type="number" min="0" step="0.01" placeholder="0,00" />
          <div>Troco: <strong id="change">R$ 0,00</strong></div>
        </div>
        <button class="finish" id="finishSale">FINALIZAR VENDA</button>
      </div>
    </aside>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><h2 id="modalTitle">Configurações</h2><button id="closeModal">✕</button></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
